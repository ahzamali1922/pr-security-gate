name: PR Security Scan

on:
  pull_request:

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pylint
        run: |
          python -m pip install --upgrade pip
          pip install pylint

      - name: Run Pylint
        run: |
          pylint demo-app/python --output-format=json > pylint-report.json || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Initialize npm
        run: |
          npm init -y

      - name: Install ESLint
        run: |
          npm install --save-dev eslint

      - name: Run ESLint
        run: |
          npx eslint demo-app/javascript -f json > eslint-report.json || true

      - name: Upload scan reports
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: |
            pylint-report.json
            eslint-report.json